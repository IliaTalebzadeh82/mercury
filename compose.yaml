name: mercury

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mercury
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - mercury-postgres:/var/lib/postgresql/data

volumes:
  mercury-postgres:
