name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MERCURY_TEST_DATABASE_URL: postgres://mercury:mercury@localhost:55432/mercury_integration_test?sslmode=disable
      MERCURY_MIGRATION_TEST_DATABASE_URL: postgres://mercury:mercury@localhost:55432/mercury_migration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose config --quiet
      - run: make infra-up
      - run: make backend-check
      - run: make migrate-test
      - if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      MERCURY_TEST_DATABASE_URL: postgres://mercury:mercury@localhost:55432/mercury_integration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: docker compose config --quiet
      - run: make infra-up
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - run: make frontend-e2e
      - if: always()
        run: docker compose down --volumes
